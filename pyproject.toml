[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mdsview"
version = "0.2.0"
description = "View and analyze MITgcm MDS (.data/.meta) binary output"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Rhett R. Adam", email = "rhettradam@gmail.com" }]
dependencies = [
    "numpy>=1.20",
    "matplotlib>=3.5",
    "MITgcmutils>=0.1",
    "cmocean>=4.0",
    "pillow>=9.0",
]

[project.optional-dependencies]
gui = ["customtkinter>=5.2"]
dev = ["pytest>=7"]
all = ["customtkinter>=5.2", "pytest>=7"]

[project.scripts]
mdsview = "mdsview.cli:main"

[project.urls]
Homepage = "https://github.com/rhettadam/mdsview"
Repository = "https://github.com/rhettadam/mdsview"
Issues = "https://github.com/rhettadam/mdsview/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["mdsview*"]
