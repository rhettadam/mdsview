[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mdsview"
version = "0.2.1"
description = "Browse, plot, and compare MITgcm MDS binary output from the CLI or an optional GUI."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rhett R. Adam", email = "rhettradam@gmail.com" }]
keywords = ["mitgcm", "ocean", "climate", "mds", "visualization", "hpc", "netcdf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Oceanography",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.20",
    "matplotlib>=3.5",
    "MITgcmutils>=0.1",
    "cmocean>=4.0",
    "pillow>=9.0",
]

[project.optional-dependencies]
gui = ["customtkinter>=5.2"]
dev = ["pytest>=7"]
all = ["customtkinter>=5.2", "pytest>=7"]

[project.scripts]
mdsview = "mdsview.cli:main"

[project.urls]
Homepage = "https://rhettadam.github.io/mdsview/"
Documentation = "https://rhettadam.github.io/mdsview/"
Repository = "https://github.com/rhettadam/mdsview"
"Bug Tracker" = "https://github.com/rhettadam/mdsview/issues"
Changelog = "https://github.com/rhettadam/mdsview/releases"

[tool.setuptools.packages.find]
where = ["."]
include = ["mdsview*"]

[tool.setuptools.package-data]
mdsview = ["assets/*.png"]
